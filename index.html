    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if not patchable
        }
      })();
    </script>
